---
# Prometheus – scrapes OTel Collector metrics endpoint + annotated pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources: [nodes, nodes/metrics, services, endpoints, pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get]
- nonResourceURLs: [/metrics, /metrics/cadvisor]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers: []

    scrape_configs:
      # OTel Collector – application metrics (from microservices via OTLP)
      - job_name: otel-collector
        static_configs:
          - targets: ['opentelemetrycollector:8889']

      # OTel Collector – internal metrics (spans received, dropped, etc.)
      - job_name: otel-collector-internal
        static_configs:
          - targets: ['opentelemetrycollector:8888']

      # Auto-discover pods with prometheus.io/scrape=true
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

  alert-rules.yaml: |
    groups:
      - name: online-boutique
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) by (service_name)
              /
              sum(rate(http_server_request_duration_seconds_count[5m])) by (service_name)
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP error rate on {{ $labels.service_name }}"
              description: "Error rate is {{ $value | humanizePercentage }} (threshold 5%)."

          - alert: HighLatencyP99
            expr: |
              histogram_quantile(0.99,
                sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p99 latency on {{ $labels.service_name }}"
              description: "p99 latency is {{ $value | humanizeDuration }} (threshold 2s)."

          - alert: ServiceDown
            expr: |
              up{job="otel-collector"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "OTel Collector is down"
              description: "Metrics collection is unavailable."

          - alert: PodCrashLooping
            expr: |
              increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash-looping"
              description: "Container {{ $labels.container }} restarted {{ $value }} times in 15min."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --web.enable-lifecycle
        - --web.enable-remote-write-receiver
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
          items:
          - key: prometheus.yml
            path: prometheus.yml
      - name: rules
        configMap:
          name: prometheus-config
          items:
          - key: alert-rules.yaml
            path: alert-rules.yaml
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
  type: ClusterIP
