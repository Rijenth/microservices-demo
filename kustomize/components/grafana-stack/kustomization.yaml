apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# NOTE: Use this component instead of (not alongside) google-cloud-operations.
# Both provide an OTel Collector – they are mutually exclusive.
#
# What this component deploys:
#   - OpenTelemetry Collector  → forwards traces to Tempo, metrics to Prometheus
#   - Prometheus               → metrics storage + alert rules
#   - Loki + Promtail          → centralized log aggregation
#   - Tempo                    → distributed tracing backend
#   - Grafana                  → unified UI for metrics / logs / traces + alerting
#
# Enable in kustomize/kustomization.yaml:
#   components:
#     - components/grafana-stack

resources:
  - otel-collector.yaml
  - prometheus.yaml
  - loki.yaml
  - promtail.yaml
  - tempo.yaml
  - grafana.yaml

patches:
# checkoutservice
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: checkoutservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: COLLECTOR_SERVICE_ADDR
                value: "opentelemetrycollector:4317"
              - name: OTEL_SERVICE_NAME
                value: "checkoutservice"
              - name: ENABLE_TRACING
                value: "1"
              - name: ENABLE_STATS
                value: "1"

